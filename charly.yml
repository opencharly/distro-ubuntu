# The KubeVirt bed. Unlike the libvirt bed this does NOT restate the recipe: it composes the
# SAME candy onto the SAME entity through add_candy, which is what makes one recipe serve both
# substrates. disposable: true is the authorization for the destroy/rebuild path it exercises.
# The disk-builder's OWN bed. The vm: substrate BUILDS the box it boots, so a defect in
# githubrunner-ubuntu-disk fails HERE -- which is the coverage the KubeVirt bed cannot give it,
# because a kubevirt deploy can only reference a same-kind template and boots an image by reference.
check-githubrunner-ubuntu-disk:
    vm:
        from: githubrunner-ubuntu-disk
        disposable: true
        lifecycle: dev
        plan:
            - check: command=test -f /etc/os-release && grep -q 'VERSION_CODENAME=noble' /etc/os-release && echo DISK-BUILD-OK
              id: disk-built-and-bootable
              description: |
                Proves the disk builder actually produced a bootable noble rootfs: this guest was booted
                from the built disk, so the assertion cannot pass if the build is broken.
              stdout:
                - contains: DISK-BUILD-OK
              exit_status: 0
              context: ['runtime']
              command: |
                set -euo pipefail
                test -f /etc/os-release
                grep -q 'VERSION_CODENAME=noble' /etc/os-release
                echo DISK-BUILD-OK
        description: |
            R10 proof of githubrunner-ubuntu-disk. Fails without that entity, and therefore gives the
            boot-disk builder the coverage the KubeVirt bed structurally cannot.
check-githubrunner-ubuntu-vmi:
    kubevirt:
        from: githubrunner-ubuntu-vmi
        add_candy:
            - github-runner-ubuntu
        disposable: true
        lifecycle: dev
        plan:
            - check: command=test -x /home/ubuntu/actions-runner-base/bin/Runner.Listener && test -S /run/docker-ci.sock && echo KUBEVIRT-CANDY-OK
              id: candy-converged-on-kubevirt
              description: |
                The SAME candy that the libvirt bed proves here converges on a DIFFERENT
                substrate. Asserts the two artifacts that only exist when the recipe actually
                ran in this guest: the Actions runner agent binary, and the co-tenant
                docker-ci.service socket. A bare textual check asserts nothing and charly would
                try to execute the text as a command, so this carries a real command and the
                `runtime` context that makes it a live probe rather than a mutating deploy step.
              stdout:
                - contains: KUBEVIRT-CANDY-OK
              exit_status: 0
              context: ['runtime']
              command: |
                set -euo pipefail
                test -x /home/ubuntu/actions-runner-base/bin/Runner.Listener
                test -S /run/docker-ci.sock
                echo KUBEVIRT-CANDY-OK
            # A PREBUILT-DISK deploy gets only the candy's deploy-context steps, so the
            # build-scope `distro.ubuntu.package:` list never lands here. This is the check
            # that can catch a deploy-scope gap (the Chromium set was in the wrong scope
            # until this bed asserted it).
            - check: the deploy-scope job toolchain is present in the prebuilt-disk guest
              id: deploy-scope-toolchain
              description: |
                Asserts the deploy-time install, not the build-scope package list: a tool
                that is only in `distro.ubuntu.package:` is absent here.
              stdout:
                - contains: DEPLOY-SCOPE-TOOLCHAIN-OK
              exit_status: 0
              context: ['runtime']
              command: |
                set -euo pipefail
                for tool in node gh ruby skopeo pip3 unzip zip tree; do
                  command -v "$tool" >/dev/null || { echo "missing deploy-scope tool: $tool" >&2; exit 1; }
                done
                dpkg-query -W -f='${Status}' libnss3 | grep -q 'install ok installed' \
                  || { echo "missing Chromium runtime package: libnss3" >&2; exit 1; }
                echo DEPLOY-SCOPE-TOOLCHAIN-OK
        description: |
            R10 proof of the KubeVirt form of the CI-runner recipe, on the configured quant-dev
            cluster. The candy is composed by THIS deploy over the substrate's managed
            port-forward, so a green run proves the recipe is substrate-independent rather than
            libvirt-specific, and that the data_volume/EFI/q35 boot path carries it.

check-githubrunner-ubuntu-vm:
    vm:
        from: githubrunner-ubuntu
        # The recipe is applied by THIS candy through the deploy's InstallPlan — in the
        # guest, over the substrate's SSH — so the bed keeps its "wait for first boot,
        # then assert" shape and the recipe stops being cloud-init that a bed has to race.
        add_candy:
            - github-runner-ubuntu
        disposable: true
        lifecycle: dev
        description: |
            Sole R10 proof of the co-tenant-safe CI-runner VM recipe. Boots the
            githubrunner-ubuntu cloud_image VM (UEFI-insecure, q35, 128 GiB, auto-allocated
            ssh port) and asserts, from inside the guest, the six things the host `no`
            fleet depends on: Docker client+server are exactly 29.4.0 as the CI's
            setup-test-docker asserts; the daemon is `docker-ci.service` on
            /run/docker-ci.sock while the stock docker.service/socket are inactive;
            /var/run/docker.sock resolves to the daemon socket and every runner
            drop-in sets DOCKER_HOST to it; simulating that lane's mutation (stop the
            stock unit, relink the shared symlink) leaves a DOCKER_HOST co-tenant
            working and the heal timer restores the symlink; the store GC collects a
            leaked builder while another job is running, and that unprivileged user
            namespaces work; and the runner tree plus the exact label set are in place
            for the token-guarded registration. Nothing here registers a runner or needs
            a secret.
        plan:
            - check: the guest has finished first boot and the recipe's artifacts have converged
              id: cloud-init-complete
              description: |
                The guest has finished its first-boot cloud-init before anything else is
                asserted. The recipe is applied BY cloud-init (Docker install, the daemon
                split, both timers, the store GC, the runner tree, the swapfile), so a bed
                that starts asserting as soon as ssh answers races the guest and reports
                recipe failures that are really "not applied yet" — measured on the first two
                R10 runs, where `resources-and-timers` failed with an empty stderr and every
                one of its conditions was true two minutes later. A cloud-init ERROR fails
                loudly with its detail rather than waiting out the timeout.
              stdout:
                - contains: CLOUD-INIT-COMPLETE-OK
              exit_status: 0
              timeout: 700s
              context:
                - runtime
              command: |
                set -eu
                for i in $(seq 1 60); do
                  st=$(cloud-init status 2>/dev/null || true)
                  case "$st" in
                    *"status: done"*) printf 'CLOUD-INIT-COMPLETE-OK\n'; exit 0;;
                    *"status: error"*)
                      echo "cloud-init failed: $(cloud-init status --long 2>&1 | tail -3)" >&2
                      exit 1;;
                  esac
                  sleep 10
                done
                echo "cloud-init still not done after 600s" >&2
                exit 1
            - check: command=docker version --format '{{.Server.Version}}' | grep -qx 29.4.0
              id: docker-version-pinned
              description: |
                The Docker daemon runs the exact version the CI expects. openclaw-enterprise's
                setup-test-docker pins v29.4.0 and asserts the server version equals 29.4.0,
                so a drifted daemon would fail that lane's own assertion and any test
                sensitive to the engine version. Anchored on the SERVER version (not the
                client) because the daemon is what lanes talk to.
              stdout:
                - contains: "29.4.0"
              exit_status: 0
              context:
                - runtime
              command: docker version --format '{{.Server.Version}}'
            - check: the CI daemon is docker-ci.service on its own socket, with the stock unit inactive
              id: daemon-unit-split
              description: |
                The daemon the lanes use is docker-ci.service, and the stock docker.service
                is installed but NOT running, so the `systemctl stop docker.service
                docker.socket` a lane performs is a harmless no-op for its co-tenants. This
                is the exact mechanism of the 2026-10-10 failure (14:07:16 docker.service
                stopped -> 14:07:28 buildx "Cannot connect to the Docker daemon").
              stdout:
                - contains: DAEMON-SPLIT-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test "$(systemctl is-active docker-ci.service)" = active &&
                test "$(systemctl is-active docker.service)" = inactive &&
                printf 'DAEMON-SPLIT-OK\n'
            - check: the shared socket path resolves to that daemon and every runner sets DOCKER_HOST to it
              id: socket-and-per-runner-docker-host
              description: |
                The shared socket path lanes hardcode or mount resolves to the co-tenant-safe
                daemon, and the runner tree carries NO DOCKER_HOST override, so a job sees the
                same default socket a GitHub-hosted runner does and the tests that mount
                /var/run/docker.sock keep working. The override was removed after measurement:
                with DOCKER_HOST set, `TestCreateContainerCanMountDockerSocket` stopped
                mounting the socket and the scope test classified the engine as podman.
              stdout:
                - contains: SOCKET-AND-DOCKER-HOST-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test "$(readlink /var/run/docker.sock)" = /run/docker-ci.sock &&
                docker version --format '{{.Server.Version}}' >/dev/null &&
                ! grep -q '^DOCKER_HOST=' /home/ubuntu/actions-runner-base/.env 2>/dev/null &&
                printf 'SOCKET-AND-DOCKER-HOST-OK\n'
            - check: a co-tenant keeps a live daemon through DOCKER_HOST while a lane mutates the shared socket
              id: cotenant-isolation-under-lane-mutation
              description: |
                The mechanism, executed: reproduce exactly what logging-collector's
                setup-test-docker does (stop the stock unit, relink /var/run/docker.sock to
                its own daemon) and prove a co-tenant lane still reaches a live daemon
                through DOCKER_HOST, then that the heal restores the shared path. Without
                the daemon/socket split the first command sequence is what killed Images and
                Packaging buildx on 2026-10-10.
              stdout:
                - contains: COTENANT-ISOLATION-OK
              exit_status: 0
              timeout: 300s
              context:
                - runtime
              command: |
                set -eu
                sudo systemctl stop docker.service docker.socket || true
                sudo ln -sfn /tmp/not-a-socket.sock /var/run/docker.sock
                DOCKER_HOST=unix:///run/docker-ci.sock docker version --format '{{.Server.Version}}' >/dev/null
                sudo /usr/local/sbin/charly-docker-sock-heal
                test "$(readlink /var/run/docker.sock)" = /run/docker-ci.sock
                printf 'COTENANT-ISOLATION-OK\n'
            - check: the store GC drops the leaked builder and keeps the running job's
              id: store-gc-collects-leaked-builder
              description: |
                A builder leaked by a dead lane is collected WHILE another lane is running —
                the case that actually filled the disk to 100% on 2026-10-10, because the
                idle-only path cannot fire during a long run and `docker container prune`
                never touches a RUNNING buildkit builder. The fixture runs a process really
                NAMED Runner.Worker (the GC counts active jobs by process name — a command
                line containing the string must not count) and leaves two builders, the
                leaked one with a two-hour-old last-activity: the GC must drop exactly that
                one and keep the active job's. Anchored on the surviving/removed builder
                names, not on the GC's own log line.
              stdout:
                - contains: STORE-GC-COLLECTS-LEAK-WHILE-RUNNING-OK
              exit_status: 0
              timeout: 600s
              context:
                - runtime
              command: |
                set -eu
                for b in probe-keep probe-leak; do
                  sudo -u ubuntu docker buildx rm --force "$b" >/dev/null 2>&1 || true
                  sudo -u ubuntu docker rm -f "buildx_buildkit_${b}0" >/dev/null 2>&1 || true
                done
                sudo install -d -o ubuntu -m 0755 /tmp/probe-runner
                sudo cp /bin/sleep /tmp/probe-runner/Runner.Worker
                sudo pkill -f '/tmp/probe-runner/Runner.Worker' >/dev/null 2>&1 || true
                /tmp/probe-runner/Runner.Worker 90 &
                fake=$!
                trap 'kill $fake 2>/dev/null || true; sudo rm -rf /tmp/probe-runner' EXIT
                test "$(pgrep -xc Runner.Worker)" = 1
                sudo -u ubuntu docker buildx create --name probe-keep --driver docker-container >/dev/null
                sleep 2
                sudo -u ubuntu docker buildx create --name probe-leak --driver docker-container >/dev/null
                touch -d '2 hours ago' /home/ubuntu/.docker/buildx/activity/probe-leak
                sudo /usr/local/sbin/charly-docker-store-gc
                test "$(pgrep -xc Runner.Worker)" = 1
                sudo -u ubuntu docker buildx ls | grep -q probe-leak && { echo "leaked builder survived a running-job GC" >&2; exit 1; }
                sudo -u ubuntu docker buildx ls | grep -q probe-keep || { echo "the active job's builder was collected" >&2; exit 1; }
                sudo -u ubuntu docker buildx rm --force probe-keep >/dev/null 2>&1 || true
                sudo -u ubuntu docker rm -f buildx_buildkit_probe-keep0 >/dev/null 2>&1 || true
                kill "$fake" 2>/dev/null || true
                trap - EXIT
                printf 'STORE-GC-COLLECTS-LEAK-WHILE-RUNNING-OK\n'
            - check: unprivileged user namespaces work, so bwrap-sandboxed lanes can run
              id: unprivileged-user-namespaces
              description: |
                Unprivileged user namespaces work in the guest, and the AppArmor restriction
                Ubuntu 24.04 enables by default is off. This is what lets a lane sandbox
                itself with bubblewrap (Image Runtime Startup failed on 2026-10-10 with
                `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`) and what any
                rootless-container step inside a job needs. The command asserts the real
                mechanism (a uid_map write inside a new user namespace), not the sysctl
                value alone.
              stdout:
                - contains: UNPRIVILEGED-USERNS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                unshare --user --map-root-user true &&
                test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0 &&
                printf 'UNPRIVILEGED-USERNS-OK\n'
            - check: the runner tree and both exact label sets are in place for token-guarded registration
              id: runner-tree-and-registration-ready
              description: |
                The runner tree the token-guarded registration copies, and the ONE registration
                script that copies it. The label set is no longer a file on the guest: it is
                `RUNNER_LABELS` passed to the script, so there is exactly one source and it
                cannot drift from the registration command. Registration itself is deliberately
                NOT done here — a registration token lives one hour and is never committed.
              stdout:
                - contains: RUNNER-TREE-AND-REGISTRATION-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test -x /home/ubuntu/actions-runner-base/config.sh &&
                test -x /usr/local/sbin/charly-register-runners &&
                /usr/local/sbin/charly-register-runners --help >/dev/null &&
                printf 'RUNNER-TREE-AND-REGISTRATION-OK\n'
            - check: both hygiene timers are active, the journal is capped, the disk is the 128 GiB one and swap is on
              id: resources-and-timers
              description: |
                The hygiene timers and the sizing that live measurement dictated are in place:
                the store GC and the socket heal are enabled at boot, the journal is capped, the
                root filesystem really is the 128 GiB disk (asserted as a magnitude: the
                filesystem reports 122.9G once GPT overhead is taken off, and a guessed exact
                string is what made this step fail on the first R10 run — the point is that
                disk_size reached the guest, which is a mistake made twice on the live host),
                and the 8 GiB swapfile is active. Each condition reports its OWN value when it
                fails, because the first version failed with an empty stderr and named nothing.
              stdout:
                - contains: RESOURCES-AND-TIMERS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                  ok=1
                  systemctl is-active --quiet charly-docker-store-gc.timer ||
                    { echo "charly-docker-store-gc.timer=$(systemctl is-active charly-docker-store-gc.timer)"; ok=0; }
                  systemctl is-active --quiet charly-docker-sock-heal.timer ||
                    { echo "charly-docker-sock-heal.timer=$(systemctl is-active charly-docker-sock-heal.timer)"; ok=0; }
                  grep -q 'SystemMaxUse=200M' /etc/systemd/journald.conf.d/charly-ci.conf ||
                    { echo "journald cap missing"; ok=0; }
                  test "$(df -BG --output=size / | tail -1 | tr -dc '0-9')" -ge 120 ||
                    { echo "root filesystem size=$(df -BG --output=size / | tail -1)"; ok=0; }
                  swapon --show=NAME | grep -q '^/swapfile$' ||
                    { echo "swap=$(swapon --show=NAME | tr '\n' ' ')"; ok=0; }
                  test "$ok" = 1 && printf 'RESOURCES-AND-TIMERS-OK\n'


            - check: the stale docker context and buildx selection a dead lane leaves behind are repaired
              id: stale-cli-state-repaired
              description: |
                A lane that ran the CI's setup-test-docker leaves the runner user's docker context
                and buildx selection pointing at its own deleted job directory; every later docker
                CLI call that does not set DOCKER_HOST then dies with "context ... not found", which
                is what blocked the cleanup that would have prevented the 84 GB disk fill on
                2026-10-10. The step plants exactly that rot and asserts the GC repairs it AND that
                a plain `docker version` works again — the user-visible failure, not the file bytes.
              stdout:
                - contains: STALE-CLI-STATE-REPAIRED-OK
              exit_status: 0
              context:
                - runtime
              command: |
                set -eu
                # a fresh guest has no ~/.docker/config.json (docker writes it lazily), so
                # create it with the rot a dead lane leaves: a context that does not exist
                sudo -u ubuntu mkdir -p /home/ubuntu/.docker
                sudo -u ubuntu python3 -c 'import json; json.dump({"auths": {}, "currentContext": "setup-docker-action"}, open("/home/ubuntu/.docker/config.json", "w"))'
                python3 -c 'import json; d=json.load(open("/home/ubuntu/.docker/config.json")); assert d["currentContext"]=="setup-docker-action", d'
                sudo mkdir -p /home/ubuntu/.docker/buildx
                printf '{"Key":"unix:///run/docker-ci.sock","Name":"builder-deadbeef-0000-0000-0000-000000000000","Global":false}' \
                  | sudo tee /home/ubuntu/.docker/buildx/current >/dev/null
                sudo chown ubuntu:ubuntu /home/ubuntu/.docker/buildx/current
                # the rot is real: the named context does not exist
                if docker context inspect setup-docker-action >/dev/null 2>&1; then echo "planted context unexpectedly exists" >&2; exit 1; fi
                sudo /usr/local/sbin/charly-docker-store-gc
                python3 -c 'import json; d=json.load(open("/home/ubuntu/.docker/config.json")); assert d["currentContext"]=="default", d'
                test ! -f /home/ubuntu/.docker/buildx/current
                printf 'STALE-CLI-STATE-REPAIRED-OK\n'
            - check: with no CI job running the GC collects what a finished lane left behind
              id: idle-purge-collects-leftover
              description: |
                The idle branch (script step 5) is what collects the containers and volumes of lanes
                that died without cleaning up. It keeps an age grace so a job starting mid-purge
                cannot lose its containers, so the step drives it by setting the grace to zero —
                without that override the branch is untestable in a bed, and a regression in it
                would pass the gate.
              stdout:
                - contains: IDLE-PURGE-OK
              exit_status: 0
              timeout: 600s
              context:
                - runtime
              command: |
                set -eu
                # strays from an earlier step must not masquerade as an active job
                sudo pkill -f '/tmp/probe-runner/Runner.Worker' >/dev/null 2>&1 || true
                sleep 1
                test "$(pgrep -xc Runner.Worker 2>/dev/null || true)" = 0
                # idempotent: this step runs at deploy-add AND at check-live
                docker rm -f probe-leftover >/dev/null 2>&1 || true
                docker volume rm probe-leftover >/dev/null 2>&1 || true
                docker pull -q alpine >/dev/null
                docker volume create probe-leftover >/dev/null
                docker run -d --name probe-leftover -v probe-leftover:/x alpine sleep 600 >/dev/null
                sudo env CHARLY_GC_MIN_AGE=0 /usr/local/sbin/charly-docker-store-gc
                test -z "$(docker ps -aq)"
                if docker volume inspect probe-leftover >/dev/null 2>&1; then echo "volume survived the idle purge" >&2; exit 1; fi
                printf 'IDLE-PURGE-OK\n'
            - check: the disk-pressure branch collects a stale leftover while a CI job is running
              id: pressure-purge-while-running
              description: |
                The pressure branch is the safety valve for a run that fills the disk while lanes are
                active: it may only touch containers older than the longest lane, so an in-flight job
                keeps its own. The step runs a process really named Runner.Worker (so the GC sees one
                active job) with the pressure percentage and that age floor driven to zero, and
                asserts the stale leftover goes while the job's own process survives.
              stdout:
                - contains: PRESSURE-PURGE-OK
              exit_status: 0
              timeout: 600s
              context:
                - runtime
              command: |
                set -eu
                for c in probe-pressure buildx_buildkit_probe-runner0; do docker rm -f "$c" >/dev/null 2>&1 || true; done
                docker volume rm probe-pressure >/dev/null 2>&1 || true
                sudo install -d -o ubuntu -m 0755 /tmp/probe-runner
                sudo cp /bin/sleep /tmp/probe-runner/Runner.Worker
                sudo pkill -f '/tmp/probe-runner/Runner.Worker' >/dev/null 2>&1 || true
                /tmp/probe-runner/Runner.Worker 90 &
                fake=$!
                trap 'kill $fake 2>/dev/null || true; sudo rm -rf /tmp/probe-runner' EXIT
                test "$(pgrep -xc Runner.Worker)" = 1
                docker pull -q alpine >/dev/null
                docker volume create probe-pressure >/dev/null
                docker run -d --name probe-pressure -v probe-pressure:/x alpine sleep 600 >/dev/null
                sudo env CHARLY_GC_PRESSURE_PCT=0 CHARLY_GC_PRESSURE_AGE=0 /usr/local/sbin/charly-docker-store-gc
                if docker ps -aq --filter name=probe-pressure | grep -q .; then echo "stale leftover survived the pressure purge" >&2; exit 1; fi
                test "$(pgrep -xc Runner.Worker)" = 1
                kill "$fake" 2>/dev/null || true
                trap - EXIT
                sudo rm -rf /tmp/probe-runner
                printf 'PRESSURE-PURGE-OK\n'
# Disposable R10 test bed for the ubuntu bootstrap VM (kind:check — the
# 2026-05 deploy→check unification moved repo-shipped disposable beds out of
# deploy.yml). disposable: true is the sole authorization for the unattended
# destroy+rebuild driven by `charly check run check-ubuntu-debootstrap-vm`.

check-ubuntu-debootstrap-vm:
    vm:
        from: ubuntu-debootstrap
        disposable: true
        lifecycle: dev
        description: Sole proof the charly toolchain installs on a from-scratch debootstrap Ubuntu 24.04 VM — the charly candy's copy step lands the binary at /usr/bin/charly, the composed virtualization/gocryptfs/socat layers install their deps, and the tailscale apt-repo distro-cascade deterministically picks ubuntu/noble. Boots the ubuntu-debootstrap VM under libvirt/QEMU (UEFI-insecure, q35, ext4, an auto-allocated ssh port), overlays the charly candy via add_candy, then runs four guest command checks — the binary present and executable at /usr/bin/charly (CHARLY-BINARY-OK), the welded command plugins dispatching project-less (WELDED-CMD-PROJECT-LESS-OK), the tailscale package installed (TAILSCALE-PKG-OK), and grep of tailscale.list for 'stable/ubuntu noble'.
        # charly binary install witness: the charly candy's copy step lands the
        # in-development binary at /usr/bin/charly (the localpkg package install is
        # removed by the remove-candy-localpkg cutover). Every assertion below is
        # anchored on the MECHANISM: the deploy stages its own host binary under
        # /tmp for its own use, so only a /usr/bin/charly-anchored probe can tell
        # a real candy install from the deploy's scaffolding. tailscale is NOT in
        # the binary — the charly candy supplies it via the tailscale apt repo, so
        # it must ALSO be present after deploy, which the tailscale-package-installed
        # check asserts directly (the sources.list grep proves only that the right
        # suite was selected, not that the package landed).
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.274.0345'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true # skip composed layers lacking a guest-format section; the charly candy's copy step + composed layers install the binary and deps
        plan:
            - check: |
                command=test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
              id: charly-binary-installed
              description: charly binary installed on the guest AT /usr/bin/charly via the charly candy's copy step (the localpkg package install is removed by the remove-candy-localpkg cutover). Path-anchored deliberately — the deploy stages its OWN host binary at a versioned /tmp path for deploy use (spec/exec/charly_install.go, which never alters PATH), so an unanchored `command -v charly` passes even when the candy installed nothing and cannot discriminate the install mechanism this step names.
              stdout:
                - contains: CHARLY-BINARY-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
            - check: command=dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
              id: tailscale-package-installed
              description: the tailscale PACKAGE reached the guest via the charly candy's tailscale apt repo — tailscale is not in the charly binary, so the apt-repo cascade delivering it is exactly what this bed exists to prove. Asserting the sources.list entry alone would prove the repo was configured, not that the package installed.
              stdout:
                - contains: TAILSCALE-PKG-OK
              exit_status: 0
              context:
                - runtime
              command: dpkg -s tailscale >/dev/null 2>&1 && echo TAILSCALE-PKG-OK
            - check: the welded command plugins dispatch project-less from the installed charly binary
              id: welded-command-project-less
              description: the charly binary's compiled-in command:<word> plugins (doctor/vm/clean/…) dispatch project-less from /tmp on the installed binary
              stdout:
                - contains: WELDED-CMD-PROJECT-LESS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                cd /tmp &&
                /usr/bin/charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo WELDED-CMD-PROJECT-LESS-OK
            - check: command=grep -h 'pkgs[.]tailscale[.]com/stable/ubuntu noble' /etc/apt/sources.list.d/tailscale.list
              id: tailscale-repo-suite-ubuntu-noble
              description: distro-cascade resolves the ubuntu/noble tailscale apt repo (not debian/trixie) deterministically
              exit_status: 0
              context:
                - runtime
              command: grep -h 'pkgs[.]tailscale[.]com/stable/ubuntu noble' /etc/apt/sources.list.d/tailscale.list
# Disposable R10 pod bed for the ubuntu-coder image (kind:check, target:pod) —
# the pod x ubuntu cross-cell the bootstrap-VM bed above does not cover. Mirrors
# check-fedora-coder-pod on the deb substrate; ports auto-allocate on 127.0.0.1
# at deploy (no port: pin), so a run never collides with a production deploy or a
# concurrent bed. The composed candies' baked file/package/service/command checks
# (incl. the noble exclude_distros package divergences) run via `charly check
# live`; this bed adds a host-side status assertion + a noble base-identity probe.
check-ubuntu-coder-pod:
    pod:
        image: ubuntu-coder
        disposable: true
        lifecycle: dev
        description: R10 bed for the ubuntu-coder image — proves the Ubuntu developer pod (sshd + language runtimes + AI CLIs on the Ubuntu 24.04 noble base) builds and runs as one composed pod. Builds box:ubuntu-coder, deploys, runs the composed baked file/package/service/command checks + charly status --json, and exercises the noble exclude_distros package divergences.
        plan:
            - check: command=charly status --json
              id: status-shows-pod
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-ubuntu-coder-pod
              context:
                - runtime
              command:
                command: charly status --json
                in_container: false
            - check: the guest base is Ubuntu noble (not Debian)
              id: noble-base-identity
              exit_status: 0
              context:
                - runtime
              command: grep -q 'VERSION_CODENAME=noble' /etc/os-release
ubuntu-debootstrap:
    vm:
        # Bootstrap-from-scratch via debootstrap inside the ubuntu-debootstrap-
        # builder container, then booted under libvirt/QEMU. The debootstrap
        # builder template + distro.ubuntu config (which inherits debian) resolve
        # from the embedded build vocabulary (`charly/charly.yml`).
        source:
            kind: bootstrap
            builder: debootstrap
            builder_image: ubuntu-debootstrap-builder
            distro: ubuntu
            package:
                - sudo
                - openssh-server
                - qemu-guest-agent
                - cloud-init
            rootfs: ext4
            kernel_args: console=tty0 console=ttyS0,115200
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        network:
            mode: user
        ssh:
            user: ubuntu
            # port_auto: the runner allocates a free host SSH port and persists it
            # in vm_state — no manual deconfliction, so this disposable bed runs
            # concurrently with any other VM bed AND the cachyos-gpu operator VM.
            port_auto: true
            key_source: generate
        cloud_init:
            # The ubuntu account (sudo NOPASSWD + /bin/bash + ssh key +
            # wheel/sudo) is provisioned from ssh.user via the cloud-init
            # create-pattern (composeUsers), so no explicit users: block is
            # needed here.
            runcmd:
                - systemctl enable --now ssh
                - systemctl enable --now qemu-guest-agent
                - "{ ip a; echo ===listen===; ss -tlnp; echo ===ssh===; systemctl status ssh --no-pager; } > /boot/charly-diag.txt 2>&1"
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
githubrunner-ubuntu-skill:
    skill:
        name: githubrunner-ubuntu
        family: distros
        # The skill teaches the `githubrunner-ubuntu` VM, whose recipe IS the
        # `github-runner-ubuntu` candy (extracted from that entity as cloud-init,
        # opencharly/distro-ubuntu#37). A VM has no source directory, so a candy owns it.
        owner: github-runner-ubuntu
        triggers:
            - "The CI-runner Ubuntu VM / `githubrunner-ubuntu` / the `check-githubrunner-ubuntu-vm` bed"
            - "A CI lane failing on a self-hosted Ubuntu runner (docker daemon, disk, buildx builder)"

# The ClawSweeper review bed. A disposable pod runs the image against a TWO-COMMIT fixture
# whose second commit introduces a deliberate defect, and asserts that the engine loads and
# reaches the model boundary. A check bed exports NO secret, so the model leg cannot run here;
# it is never mocked either (R8) — the live round-trip is the advisory workflow's job, where
# the org key exists.
check-clawsweeper-review-pod:
    pod:
        image: clawsweeper-review
        disposable: true
        lifecycle: dev
        plan:
            - check: the entrypoint runs the engine to a report and never dies on its own permissions
              id: review-verdict
              description: |
                A check bed exports NO secret, so `OLLAMA_API_KEY` can never resolve here (the
                runner resolves only its own auto-exported variables — a key guard in a check
                step is a DEAD assertion), and the model leg is therefore not exercised in this
                bed. It is never faked either (R8). What IS proven: the fixture exists, the
                entrypoint's flag contract holds, `jq` is present, the engine reaches the model
                boundary, and nothing fails on the image's own permissions.
              context: [runtime]
              exit_status: 0
              command: |
                  set -euo pipefail
                  # A check step prepares its own input: a `run:` step is SKIPPED in
                  # verify-only mode (measured: "skipped — verify-only mode (mutating step)").
                  rm -rf /tmp/fixture && mkdir -p /tmp/fixture
                  git init -q -b main /tmp/fixture
                  git -C /tmp/fixture config user.email fixture@example.invalid
                  git -C /tmp/fixture config user.name fixture
                  printf 'def add(a, b):\n    return a + b\n' > /tmp/fixture/calc.py
                  git -C /tmp/fixture add calc.py
                  git -C /tmp/fixture commit -qm "base: add() adds"
                  printf 'def add(a, b):\n    return a - b\n' > /tmp/fixture/calc.py
                  git -C /tmp/fixture add calc.py
                  git -C /tmp/fixture commit -qm "defect: add() subtracts"

                  command -v clawsweeper-review
                  help="$(clawsweeper-review --help)"
                  printf '%s\n' "$help" | grep -q -- '--local-range'
                  printf '%s\n' "$help" | grep -q -- '--result-format json'
                  jq --version

                  base="$(git -C /tmp/fixture rev-parse HEAD~1)"
                  out="$(CLAWSWEEPER_TARGET_REPO=opencharly/fixture BASE_SHA="$base" TARGET_DIR=/tmp/fixture clawsweeper-review 2>&1 || true)"
                  printf '%s\n' "$out" | tail -3

                  # The regression that killed every review: an unwritable CODEX_HOME dies at
                  # "failed to initialize in-process app-server client: Permission denied"
                  # before the model is reached.
                  if printf '%s\n' "$out" | grep -q 'Permission denied'; then
                    echo "the engine died on the image's own permissions"
                    exit 1
                  fi
                  # It reached the model boundary: a report was produced. NO key-shaped
                  # assertion — the check must not depend on the key being ABSENT, which is
                  # the trap the layer's own runtime check was blocked for.
                  printf '%s\n' "$out" | grep -q '"reports"'
                  echo REVIEW-ENGINE-REACHED-MODEL-BOUNDARY
        description: |
            R10 proof of the review image: the engine converges, accepts an opencharly/* target
            through the profile overlay, and reaches the model boundary. The live model
            round-trip needs a key, which a check bed cannot supply — that leg is the advisory
            workflow's job (opencharly/.github `clawsweeper-review.yml`).

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
ubuntu-debootstrap-vm-skill:
    skill:
        name: ubuntu-debootstrap-vm
        family: vm
        owner: ubuntu-skills
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
