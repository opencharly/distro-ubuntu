#  opencharly/distro-ubuntu — the Ubuntu image family, split out of the main
#  opencharly repo (2026-05). Mounted as a git submodule at box/ubuntu.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the ubuntu base + debootstrap family, the ubuntu-coder/-builder images, the
#  ubuntu bootstrap VM, and the disposable check bed) is inlined here. This repo
#  VENDORS NOTHING — every layer is an `@github.com/...` ref into main's shared
#  candy library, and the shared build-config (distro/builder/init vocabulary) is
#  EMBEDDED in the `charly` binary (`charly/charly.yml`) — not imported.
#
#  import: is EMPTY here (`import: []`). Ubuntu roots on EXTERNAL bases entirely
#  (the `ubuntu` base is docker.io `ubuntu:24.04`, the debootstrap builder is
#  `base: debian:13`), so it has NO cross-repo entity refs — and with the build
#  vocabulary embedded in the binary, it imports NOTHING.
#
#  Ubuntu is deb-family: `distro.ubuntu` is `inherits: debian` in the EMBEDDED
#  build vocabulary (`charly/charly.yml`, which carries BOTH the debian and ubuntu
#  distro configs), so the inheritance resolves from the embedded vocab. Nothing
#  in the main repo consumes any Ubuntu image, so there is NO main ↔ ubuntu
#  coupling — the only edge is ubuntu → main's shared candy layers via `@github` refs.
#
#  Directly buildable: `charly box build ubuntu` (the build verb defaults to this
#  charly.yml). From the parent repo: `charly -C box/ubuntu box build
#  ubuntu`, or anywhere: `charly --repo opencharly/distro-ubuntu box build ubuntu`.
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - deb
    merge:
        auto: false
        max_mb: 128
import: []
# Disposable R10 test bed for the CI-runner Ubuntu VM (kind:check) — the recipe the
# org's own self-hosted runner fleet uses on host `no` for the Blacksmith-shaped CI of
# opencharly/openclaw-enterprise, whose lanes need a rootful Docker daemon, privileged
# k3s node containers and systemd — none of which a rootless pod can provide.
#
# WHY THIS VM LOOKS THE WAY IT DOES (all measured on the live fleet 2026-10-10; the
# workflows are written for ONE JOB PER MACHINE and this VM packs several runners onto
# one host, so every piece below exists to make that safe):
#   * Docker is pinned to 29.4.0 — the version the CI's own `setup-test-docker` action
#     installs AND asserts (`docker version --format '{{.Server.Version}}' = 29.4.0`).
#   * The daemon runs as `docker-ci.service` on its OWN socket `/run/docker-ci.sock`,
#     NOT as `docker.service`: a lane that runs `systemctl stop docker.service
#     docker.socket` (logging-collector's setup) must not stop the daemon its
#     co-tenants are using. Measured failure this prevents: 14:07:16 docker.service
#     stopped -> 14:07:28 Images and Packaging `docker buildx create` -> "Cannot
#     connect to the Docker daemon at unix:///var/run/docker.sock".
#   * `/var/run/docker.sock` stays a symlink to it, because lanes, helpers and tests
#     hardcode or mount that path (tests/helpers/runtime-image-fixture.mjs,
#     docker-compute-token-retry, the production-compose mounts).
#   * Every runner instance sets DOCKER_HOST to the daemon's own socket, so a lane that
#     relinks the shared symlink cannot redirect its co-tenants.
#   * A timer repairs a dangling /var/run/docker.sock after such a lane.
#   * A store GC collects the leak that filled the disk to 100% on 2026-10-10: every
#     `docker/setup-buildx-action` starts a buildkit builder container with its own
#     anonymous cache volume, and a lane that is cancelled or times out never removes
#     it — 13 of them held 84 GB. The GC also repairs the docker context/buildx
#     selection a lane leaves pointing at its deleted job directory, which otherwise
#     breaks every later docker CLI call that does not set DOCKER_HOST.
#   * journald is capped, so a log flood can never fill the disk either.
#   * the store GC also collects leaks WHILE lanes run (a builder whose endpoint socket
#     is gone, plus the surplus above the number of ACTIVE runner jobs, oldest
#     last-activity first), and it runs its buildx verbs as the runner user because
#     buildx state is per-user — the first version silently read root's empty state and
#     a whitespace bug made it treat every builder's endpoint as gone (measured: it
#     deleted 15 builders, two of them live).
#   * unprivileged user namespaces are enabled: Ubuntu 24.04's AppArmor restriction
#     breaks lanes that sandbox with bubblewrap (`bwrap: loopback: Failed RTM_NEWADDR`).
#   * 128 GiB disk / 32 GiB RAM / 16 vCPU / 8 GiB swapfile: sized from live measurements
#     of four concurrent lanes (peak ~12 GiB on the 15 GiB original, 44 GiB of docker
#     state on the 61 GiB original).
# The external cluster this recipe's KubeVirt substrate deploys onto. ONE place holds the
# cluster-specific knobs, so the entity below names a profile instead of hardcoding a venue.
# The boot disk for the KubeVirt form. A data_volume+http source CANNOT work on quant-dev: the CDI
# importer there cannot open its block device (`blockdev: cannot open /dev/cdi-block-volume:
# Permission denied`, measured), so deploy-add times out waiting on a DataVolume that never becomes
# ready. A container_disk fed by a disk CHARLY builds and pushes is the arm this cluster supports, and
# it is also the one that keeps the whole configuration charly.yml-only.
githubrunner-ubuntu-disk:
    vm:
        source:
            kind: cloud_image
            distro: ubuntu
            url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
            base_user: ubuntu
        disk_size: 128G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: uefi-insecure
        # REQUIRED, not decoration: without this the baked disk carries no authorized key, the
        # KubeVirt deploy cannot reach the guest over the substrate's port-forward, and the candy
        # walk stalls with no output until the bed times out. Measured by diffing this entity
        # against the P4 spike's ubuntu-runner-disk, which had exactly these fields and worked.
        ssh:
            user: ubuntu
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            # The guest agent is what lets the substrate reach into a booted VM. Without it
            # KubeVirt never reports AgentConnected, charly never opens the managed
            # port-forward, and the deploy sits in deploy-add with no output until it times
            # out. Baked into the disk so it is present on every boot, not just the first.
            package:
                - qemu-guest-agent
            charly_install:
                strategy: auto

quant-dev:
    kubernetes:
        kubeconfig_context: kubernetes-admin@quant-dev
        default_namespace: default
        admission_policy: privileged
        storage:
            class_default: csi-cinder-high-speed-gen2

githubrunner-ubuntu:
    vm:
        source:
            kind: cloud_image
            distro: ubuntu
            url: https://cloud-images.ubuntu.com/noble/20260926/noble-server-cloudimg-amd64.img
            checksum: {type: sha256, value: 6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2}
            base_user: ubuntu
        backend: libvirt
        disk_size: 128G
        ram: 32G
        cpu: 16
        machine: q35
        firmware: uefi-insecure
        network: {mode: user}
        ssh: {user: ubuntu, port_auto: true, key_source: generate}
        # The recipe — Docker, the co-tenant daemon split, both timers, the store GC, the
        # runner tree — is NOT here any more. It is `candy/github-runner-ubuntu`, one
        # canonical home composed by the deploy of each substrate's bed --
        # check-githubrunner-ubuntu-vm via add_candy on this box, and
        # check-githubrunner-ubuntu-vmi via add_candy on the KubeVirt template -- so the same
        # recipe serves both substrates instead of being re-authored per substrate
        # (decision D1, issue 37).
        cloud_init:
            timezone: UTC
# Disposable R10 bed for the CI-runner VM entity above. `disposable: true` is the sole
# authorization for the unattended destroy+rebuild `charly check run` drives. Every step
# is anchored on the MECHANISM it proves, never on a proxy for it: the pinned Docker
# version the CI asserts, the daemon/socket split that keeps co-tenant lanes alive, the
# symlink repair, the store GC that collects a leaked builder+volume, and the runner tree
# the token-guarded registration consumes. REGISTRATION itself is NOT here — a
# registration token lives one hour and is never committed (same doctrine as
# pod-github-runner's `post_enable` hook).
# The KubeVirt substrate leg of the same VM. It composes the SAME candy the libvirt entity
# and its bed do, so the recipe has one home and this is only the substrate: a cloud image
# imported into the cluster rather than a libvirt domain on this host (decision D1, issue 37).
githubrunner-ubuntu-vmi:
    kubevirt:
        cluster: quant-dev
        namespace: default
        # The guest identity. A data_volume is a bare disk with no OCI metadata to read, so
        # unlike a containerDisk it MUST declare distro + ssh_user here (spec/schema/kubevirt.cue).
        distro: ubuntu
        ssh_user: ubuntu
        # KubeVirt cannot boot a cloud_image directly the way the vm substrate can; it boots a disk
        # ARTIFACT. That disk is built from the SAME noble image by githubrunner-ubuntu-disk below
        # and pushed by charly, so both substrates still boot one Ubuntu image (see that entity for
        # why data_volume+http cannot be used on this cluster).
        source:
            kind: container_disk
            # A DURABLE, PUBLIC ref. It replaces `ttl.sh/…:6h`, which expires by design and
            # made this leg impossible to reproduce from the committed tree (the previous
            # build is gone within hours). Rebuild and republish with:
            #   charly vm build githubrunner-ubuntu-disk --container-disk \
            #     --push ghcr.io/opencharly/githubrunner-ubuntu-disk:<CalVer>
            image: ghcr.io/opencharly/githubrunner-ubuntu-disk:2026.295.0418
            pull_policy: Always
            disk_path_in_image: /disk/disk.img
        run_strategy: Always
        memory: 32G
        cpu:
            cores: 16
        machine: q35
        # An Ubuntu cloud image is UEFI/GPT — its bootloader lives on the ESP, and KubeVirt's
        # bios default would boot nothing.
        firmware:
            bootloader: efi
        cloud_init:
            timezone: UTC
            package:
                - qemu-guest-agent
            # charly reaches into the booted guest over the substrate's managed port-forward and
            # walks the candy's plan there; the recipe is never re-authored into cloud-init.
            charly_install:
                strategy: auto
        description: >-
            The CI-runner Ubuntu VM on a KubeVirt substrate. This TEMPLATE authors only the boot
            medium and the domain shape; the recipe is applied by its deploy,
            check-githubrunner-ubuntu-vmi, which composes candy/github-runner-ubuntu through
            add_candy. It cannot be composed here: a venue-bearing kubevirt node is classified as
            a template by the loader, and templates reject add_candy.



githubrunner-ubuntu-vmi-4vcpu:
    kubevirt:
        cluster: quant-dev
        # 4 vCPU / 16 GB — the LIGHT tier at Blacksmith's x64 Ubuntu ratio of 4 GB per vCPU.
        # ONE runner per VM, and it registers with BOTH `blacksmith-2vcpu-ubuntu-2404` and
        # `blacksmith-4vcpu-ubuntu-2404`: a deliberate claim that a 4 vCPU / 16 GB host
        # satisfies both instance types, so the 2-vCPU label no longer needs a smaller size.
        # The 2-vCPU tag is an UPGRADE claim (4 >= 2): the host gives a 2-vCPU request more
        # than it asks for. That is NOT the same kind of claim as the 16-vCPU tier's
        # 32-vCPU routing label, which is an under-provision (see that tier).
        # A kubevirt deploy may NOT override cpu/memory on a `from:` template (closed disjunction,
        # measured as `from: field not allowed`), so each SIZE must be a template. The three
        # tiers exist because one size serves neither repo: openclaw-enterprise routes its
        # 4/8/16-vcpu lanes to those blacksmith labels BY NAME, so a runner must genuinely be
        # that size. The pool is 19 slots (9x4, 4x8, 1x16), 4 GB per vCPU on every tier.
        namespace: default
        # The guest identity. A data_volume is a bare disk with no OCI metadata to read, so
        # unlike a containerDisk it MUST declare distro + ssh_user here (spec/schema/kubevirt.cue).
        distro: ubuntu
        ssh_user: ubuntu
