ubuntu:
    candy:
        base: ubuntu:24.04
        build:
            - deb
        builder:
            cargo: ubuntu-builder
            npm: ubuntu-builder
            pixi: ubuntu-builder
        produce:
            - pixi
            - npm
            - cargo
        distro:
            - ubuntu:24.04
            - ubuntu
        # The skill-prose bundle: a `skill:` node's owner must be a candy, not an image
        # (opencharly/sdk#434), so the image-owned skill nodes are owned by `ubuntu-skills` and it rides
        # this image so those skills reach the ai.opencharly.skill label.
        candy:
            - ubuntu-skills
