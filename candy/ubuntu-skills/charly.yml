#  opencharly/ubuntu — the skill-prose bundle for the ubuntu image family.
#
#  WHY THIS CANDY EXISTS (opencharly/sdk#434, operator ruling): a `skill:` node's `owner:` must
#  name a CANDY. An image — a `candy:` node carrying `base:`/`from:` — has no source directory: the
#  loader folds it into the image set and never the layer set, so an image-owned skill's prose can
#  never be read. This candy owns the `skill:` nodes below instead, and their bodies live at THIS
#  REPO'S ROOT, `.agents/skills/<name>/SKILL.md` (the Agent-Skills standard tree) — the one base the
#  marketplace/docs generators and charly's install read (`deploykit.candyRepoRoot`).
#
#  THE INSTALL IS CHARLY'S, NOT THIS CANDY'S: for every image that composes this candy, kind:skill
#  installs the body of each skill it owns at the image user's `~/.agents/skills/<name>/` and carries
#  it whole in the `ai.opencharly.skill` label (opencharly/sdk#598). The candy's former
#  `copy: .agents/skills` step resolved against its own staged directory and could never reach the
#  repo root (opencharly/sdk#444). Its ADE `check:` proves the bodies landed in the image.
ubuntu-skills:
    candy:
        description: |
            Skill-prose bundle for the ubuntu image family: owns the `ubuntu`, `ubuntu-builder`, `ubuntu-debootstrap-builder`, `ubuntu-debootstrap` `skill:`
            entities (sibling nodes in this file) and carries their bodies under
            .agents/skills/<name>/SKILL.md.
            It exists because a `skill:` node's owner must be a candy, not an image — an image has
            no source directory, so an image-owned node's prose is unreadable and the skill is
            absent from the ai.opencharly.skill OCI label (opencharly/sdk#434).
            Composed into every image that carries one of those skills. Charly installs the body of
            every skill an image composes under the image user's ~/.agents/skills and labels it
            ai.opencharly.skill (kind:skill's owned content, opencharly/sdk#598), so a harness in the
            image reads the same prose the label carries; this candy owns the nodes and ships no
            install step of its own.
        plan:
            - check: every skill body this candy carries is installed under the uid-1000 account's ~/.agents/skills
              id: skill-bodies-installed
              context:
                - build
              exit_status: 0
              command: |
                  set -eu
                  H="$(awk -F: '$3 == 1000 { print $6 }' /etc/passwd)"
                  test -n "$H"
                  for s in ubuntu ubuntu-builder ubuntu-debootstrap-builder ubuntu-debootstrap; do
                      test -s "$H/.agents/skills/$s/SKILL.md"
                  done
ubuntu-skill:
    skill:
        name: ubuntu
        family: distros
        owner: ubuntu-skills
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
ubuntu-builder-skill:
    skill:
        name: ubuntu-builder
        family: distros
        owner: ubuntu-skills
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
ubuntu-debootstrap-builder-skill:
    skill:
        name: ubuntu-debootstrap-builder
        family: distros
        owner: ubuntu-skills
ubuntu-debootstrap-skill:
    skill:
        name: ubuntu-debootstrap
        family: distros
        owner: ubuntu-skills
        triggers:
            - "Ubuntu images / `ubuntu*` / `box/ubuntu` submodule"
